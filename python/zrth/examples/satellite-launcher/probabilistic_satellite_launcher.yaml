  - id: 2f517ccd-3fbc-5891-8180-ab8c79173485
    name: Debris objects
    description: Number of defunct objects produced by collisions and crashes.
    code: return state.places.Debris.count;
  - id: 0e1048ad-bc84-5630-93aa-a06dd4846044
    name: Average orbital radius
    description: Mean distance of orbiting satellites from the planet centre (the origin).
    code: |-
      const sats = state.places.Space.tokens;
      if (sats.length === 0) return 0;
      return sats.reduce((sum, s) => sum + Math.hypot(s.x, s.y), 0) / sats.length;
  - id: 915c6d54-c299-571f-896a-24ba26256d3e
    name: Average orbital speed
    description: Mean speed of the satellites currently in orbit.
    code: |-
      const sats = state.places.Space.tokens;
      if (sats.length === 0) return 0;
      return sats.reduce((sum, s) => sum + s.velocity, 0) / sats.length;
