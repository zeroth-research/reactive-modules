[package]
name = "reactor-python"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
name = "reactor"
crate-type = ["cdylib"]

[dependencies]
base = { path = "../base" }
theory = { path = "../theory", features = ["torch"] }
pyo3 = { version = "0.24" }
tch = { features = ["python-extension"], version = "0.22" }
pyo3-tch = { version = "0.22" }

